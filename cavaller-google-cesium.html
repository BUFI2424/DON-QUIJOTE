<script>
// ------------------------------------------------------------------
// CONFIGURACIÓ
// ------------------------------------------------------------------
const CFG = {
  walkSpeed: 5,        // m/s
  runSpeed: 11,        // m/s (Shift)
  jumpSpeed: 6,        // m/s inicial del salt
  gravity: 9.8,
  modelScale: 1.5,     // mida del cavaller (1 = 1,8 m)
  lookHeight: 1.8,     // la càmera mira al pit del cavaller
  turnSpeed: 10,       // com de ràpid es gira cap on camina
  mouseSens: 0.18,
  walkStride: 2.6,     // metres per cicle de passes
  runStride: 3.8,
};

// Eixos dels ossos (calculats a partir del teu .glb): eix lateral i frontal
// del cos expressats en l'espai local de cada os.
const BONES = {
  LeftUpLeg:  { lat:[-0.85, 0.43, 0.29], fwd:[0.39, 0.17, 0.90] },
  RightUpLeg: { lat:[-0.99, 0.15,-0.03], fwd:[-0.02,0.07, 1.00] },
  LeftLeg:    { lat:[-0.89, 0.36, 0.29] },
  RightLeg:   { lat:[-0.97, 0.21,-0.14] },
  LeftArm:    { lat:[ 0.65, 0.44,-0.62] },
  RightArm:   { lat:[ 0.44,-0.60, 0.67] },
};

// Calibratge (es guarda al navegador)
const CAL = Object.assign({ vfov: 35, vOffset: 0, yawOffset: 0 }, load('cav_cal3', {}));
// L'Elevation API dona l'alçada sobre el nivell del mar, però la càmera de
// Google 3D funciona sobre l'el·lipsoide: la diferència (geoide) a la península
// és d'uns 50 m. Es calcula a l'inici comparant amb Cesium (si hi ha token).
let GEOID = 51, geoidSrc = 'aprox.';
let modelStatus = 'carregant…', marker;

// ------------------------------------------------------------------
// ESTAT
// ------------------------------------------------------------------
const S = {
  lat: 0, lon: 0,
  ground: 0,          // alçada del terra sobre el nivell del mar (Elevation API)
  agl: 0, vz: 0,      // alçada sobre el terra i velocitat vertical
  facing: 0,          // cap on mira el cavaller (rad, des del nord, horari)
  heading: 0, tilt: 70, range: 14,  // càmera orbital
  phase: 0, walkAmt: 0,
  keys: {}, showGround: false,
};
let viewer, map3d, knight, bones = {}, lastT = performance.now();
const R = Cesium.Math.toRadians;

// ------------------------------------------------------------------
// INICI
// ------------------------------------------------------------------
['gkey','ctoken','coords','asset','glburl'].forEach(id => {
  const v = load('cav_'+id, null); if (v) document.getElementById(id).value = v;
});

document.getElementById('go').onclick = async () => {
  const gkey = val('gkey'), ctoken = val('ctoken'), coords = val('coords'), asset = val('asset');
  if (!gkey) return msg('Falta la clau de Google', 4000);
  if (!ctoken && !val('glburl')) return msg('Cal el token de Cesium o una URL de .glb', 4000);
  ['gkey','ctoken','coords','asset','glburl'].forEach(id => save('cav_'+id, val(id)));
  const [la, lo] = coords.split(',').map(Number);
  if (!isFinite(la) || !isFinite(lo)) return msg('Coordenades incorrectes', 4000);
  S.lat = la; S.lon = lo;
  document.getElementById('panel').style.display = 'none';
  msg('Carregant…');
  try {
    await initGoogle(gkey);
    await initCesium(ctoken, Number(asset), val('glburl'));
    initInput();
    msg('Llest! WASD per caminar', 2500);
  } catch (e) {
    console.error(e); msg('Error: ' + e.message, 10000);
  }
};

// ---------------- GOOGLE 3D MAPS (només visual) ----------------
async function initGoogle(key) {
  // Carregador oficial de Google (el mateix que recomana la documentació)
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})
  ({ key, v: 'beta' });

  let Map3DElement;
  try {
    ({ Map3DElement } = await google.maps.importLibrary('maps3d'));
  } catch (e) {
    throw new Error('Google Maps no carrega. Desactiva el bloquejador d\'anuncis per a CodePen i torna-ho a provar.');
  }
  map3d = new Map3DElement({
    center: { lat: S.lat, lng: S.lon, altitude: CFG.lookHeight },
    range: S.range, tilt: S.tilt, heading: S.heading,
    mode: 'HYBRID',
  });
  try { map3d.defaultUIHidden = true; } catch(e) {}
  document.getElementById('gmap').append(map3d);
}

// ---------------- CESIUM (transparent: física + cavaller) ----------------
async function initCesium(token, assetId, glbUrl) {
  if (token) Cesium.Ion.defaultAccessToken = token;

  viewer = new Cesium.Viewer('cesium', {
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),   // el terra el dona Google
    baseLayer: false,
    animation:false, timeline:false, baseLayerPicker:false, geocoder:false, homeButton:false,
    sceneModePicker:false, navigationHelpButton:false, fullscreenButton:false,
    infoBox:false, selectionIndicator:false,
    skyBox:false, skyAtmosphere:false,
    contextOptions: { webgl: { alpha: true } },
  });
  const sc = viewer.scene;
  sc.backgroundColor = Cesium.Color.TRANSPARENT;
  sc.globe.baseColor = Cesium.Color.TRANSPARENT;
  sc.globe.show = false;                            // Cesium només dibuixa el cavaller
  sc.globe.showGroundAtmosphere = false;
  sc.globe.enableLighting = false;
  sc.globe.depthTestAgainstTerrain = false;
  sc.fog.enabled = false;
  if (sc.sun) sc.sun.show = false;
  if (sc.moon) sc.moon.show = false;
  sc.highDynamicRange = false;
  sc.screenSpaceCameraController.enableInputs = false;   // la càmera la controlem nosaltres
  sc.light = new Cesium.DirectionalLight({ direction: new Cesium.Cartesian3(0, 0, -1), intensity: 2.5 });

  // Alçada inicial del terra (Google Elevation API)
  await fetchGrid();
  S.ground = sampleGround(S.lat, S.lon) ?? 0;
  S.agl = 25; // apareix caient del cel 😉

  // Cavaller

  // Punt groc als peus del cavaller (diagnòstic, tecla P)
  marker = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(S.lon, S.lat, S.ground),
    point: { pixelSize: 12, color: Cesium.Color.YELLOW, outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
             disableDepthTestDistance: Number.POSITIVE_INFINITY },
    show: false,
  });

  sc.preUpdate.addEventListener(tick);

  try {
    const res = glbUrl ? new Cesium.Resource({ url: glbUrl }) : await Cesium.IonResource.fromAssetId(assetId);
    const buf = await res.fetchArrayBuffer();
    knight = await Cesium.Model.fromGltfAsync({ gltf: fixSkinnedGlb(buf), scale: CFG.modelScale });
    sc.primitives.add(knight);
    knight.errorEvent.addEventListener(e => { modelStatus = 'ERROR: ' + (e.message || e); console.error(e); });
    knight.readyEvent.addEventListener(() => {
      knight.activeAnimations.addAll({ loop: Cesium.ModelAnimationLoop.REPEAT }); // Idle
      findBones();
      modelStatus = `llest · mida ${(knight.boundingSphere.radius * 2).toFixed(2)} m · ossos ${Object.keys(bones).length}/6`;
    });
  } catch (e) {
    modelStatus = 'ERROR carregant: ' + e.message; console.error(e);
  }
}

// Cesium no dibuixa bé les malles amb esquelet si el node de la malla té
// transformació pròpia (com passa amb els models exportats de Sketchfab).
// Aquí la traiem abans de carregar el model.
function fixSkinnedGlb(buf) {
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x46546c67) throw new Error('El fitxer no és un .glb');
  const jl = dv.getUint32(12, true);
  const j = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jl)));
  const rest = new Uint8Array(buf, 20 + jl);            // la resta de chunks (BIN), intactes
  const sc = j.scenes[j.scene || 0];
  j.nodes.forEach((n, i) => {
    if (n.skin === undefined || n.mesh === undefined) return;
    j.nodes.forEach(p => { if (p.children) p.children = p.children.filter(c => c !== i); });
    delete n.matrix; delete n.translation; delete n.rotation; delete n.scale;
    if (!sc.nodes.includes(i)) sc.nodes.push(i);
  });
  let js = new TextEncoder().encode(JSON.stringify(j));
  const pad = (4 - js.length % 4) % 4;
  const total = 20 + js.length + pad + rest.length;
  const out = new Uint8Array(total), o = new DataView(out.buffer);
  o.setUint32(0, 0x46546c67, true); o.setUint32(4, 2, true); o.setUint32(8, total, true);
  o.setUint32(12, js.length + pad, true); o.setUint32(16, 0x4E4F534A, true);
  out.set(js, 20); out.fill(0x20, 20 + js.length, 20 + js.length + pad);
  out.set(rest, 20 + js.length + pad);
  return out;
}

// ------------------------------------------------------------------
// TERRA: es demana una graella d'alçades al voltant del cavaller i se'n fa
// una de nova quan s'acosta a la vora. Fonts, de més a menys precisa:
//   1. IGN (MDT05, cel·les de 5 m, només Espanya)
//   2. Google Elevation API
//   3. Open-Meteo (cel·les de 90 m)
// ------------------------------------------------------------------
const GRID = { g: null, busy: false, src: '…' };   // g = { lon0, lat0, dlon, dlat, nc, nr, v }  (fila 0 = sud)
let elevSvc = null;

async function gridIGN(lat, lon) {
  const hw = 0.0007;   // ~ ±60 m
  const u = 'https://servicios.idee.es/wcs-inspire/mdt?SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage' +
    `&COVERAGEID=Elevacion4258_5&SUBSET=Lat(${(lat - hw).toFixed(6)},${(lat + hw).toFixed(6)})` +
    `&SUBSET=Long(${(lon - hw).toFixed(6)},${(lon + hw).toFixed(6)})&FORMAT=application/asc`;
  const txt = await (await fetch(u)).text();
  const a = txt.indexOf('ncols');
  if (a < 0) throw new Error('IGN sense dades');
  const body = txt.slice(a).split('--wcs')[0].trim().split(/\s+/);
  const H = {}; let k = 0;
  while (k < body.length && /^[a-z_]+$/i.test(body[k])) { H[body[k].toLowerCase()] = Number(body[k + 1]); k += 2; }
  const nc = H.ncols, nr = H.nrows, dlon = H.dx || H.cellsize, dlat = H.dy || H.cellsize;
  const raw = body.slice(k, k + nc * nr).map(Number);
  if (raw.length < nc * nr || raw.some(x => !isFinite(x) || x === H.nodata_value || x < -500)) throw new Error('IGN incomplet');
  const v = new Float64Array(nc * nr);                  // ArcGrid ve de nord a sud: el girem
  for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++) v[r * nc + c] = raw[(nr - 1 - r) * nc + c];
  // els valors són al centre de cada cel·la
  return { lon0: H.xllcorner + dlon / 2, lat0: H.yllcorner + dlat / 2, dlon, dlat, nc, nr, v };
}

async function gridPoints(lat, lon, getHeights) {
  const n = 9, step = 5, half = (n - 1) / 2;
  const dlat = step / 111320, dlon = step / (111320 * Math.cos(R(lat)));
  const locs = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) locs.push({ lat: lat + (y - half) * dlat, lng: lon + (x - half) * dlon });
  const h = await getHeights(locs);
  return { lon0: lon - half * dlon, lat0: lat - half * dlat, dlon, dlat, nc: n, nr: n, v: Float64Array.from(h) };
}
async function heightsGoogle(locs) {
  if (!elevSvc) { const { ElevationService } = await google.maps.importLibrary('elevation'); elevSvc = new ElevationService(); }
  const r = await elevSvc.getElevationForLocations({ locations: locs });
  return r.results.map(x => x.elevation);
}
async function heightsOpenMeteo(locs) {
  const lats = locs.map(l => l.lat.toFixed(6)).join(','), lons = locs.map(l => l.lng.toFixed(6)).join(',');
  const r = await (await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`)).json();
  return r.elevation;
}

async function fetchGrid() {
  if (GRID.busy) return;
  GRID.busy = true;
  const lat = S.lat, lon = S.lon;
  const sources = [
    ['IGN 5 m',     () => gridIGN(lat, lon)],
    ['Google',      () => gridPoints(lat, lon, heightsGoogle)],
    ['Open-Meteo',  () => gridPoints(lat, lon, heightsOpenMeteo)],
  ];
  for (const [name, fn] of sources) {
    try { GRID.g = await fn(); GRID.src = name; break; }
    catch (e) { console.warn('Alçades', name, 'ha fallat:', e.message); }
  }
  GRID.busy = false;
}

function sampleGround(lat, lon) {
  const g = GRID.g;
  if (!g) return null;
  const gx = (lon - g.lon0) / g.dlon, gy = (lat - g.lat0) / g.dlat;
  const m = Math.min(4, (g.nc - 1) / 4);                              // marge abans de demanar-ne una de nova
  if (gx < m || gy < m || gx > g.nc - 1 - m || gy > g.nr - 1 - m) fetchGrid();
  const x = Cesium.Math.clamp(gx, 0, g.nc - 1.001), y = Cesium.Math.clamp(gy, 0, g.nr - 1.001);
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0, V = g.v, n = g.nc;
  const a = V[y0 * n + x0], b = V[y0 * n + x0 + 1], c = V[(y0 + 1) * n + x0], d = V[(y0 + 1) * n + x0 + 1];
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}

// ------------------------------------------------------------------
// CAIGUDA A L'ABISME (tecla Ñ)
// ------------------------------------------------------------------
const FALL = { on: false, ready: false, switched: false, t: 0, off: 0, hole: null, terrain: null, layer: null };

async function startFall() {
  FALL.on = true; FALL.ready = false; FALL.switched = false; FALL.t = 0; S.vz = 0; S.agl = 0;
  const lat = S.lat, lon = S.lon;
  // forat negre que s'obre sota els peus
  FALL.hole = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lon, lat, S.ground),
    ellipse: {
      semiMajorAxis: new Cesium.CallbackProperty(() => Math.max(0.05, Math.min(3.2, FALL.t * 5)), false),
      semiMinorAxis: new Cesium.CallbackProperty(() => Math.max(0.05, Math.min(3.2, FALL.t * 5)), false),
      height: new Cesium.CallbackProperty(() => S.ground + FALL.off + 0.08, false),
      material: Cesium.Color.BLACK,
    },
  });
  // terreny i imatges de Cesium per veure el món des de sota
  try {
    if (!FALL.terrain) FALL.terrain = await Cesium.createWorldTerrainAsync();
    const [c] = await Cesium.sampleTerrainMostDetailed(FALL.terrain, [Cesium.Cartographic.fromDegrees(lon, lat)]);
    FALL.off = (c.height || S.ground) - S.ground;          // alinea el terra de Cesium amb el de Google
    viewer.scene.terrainProvider = FALL.terrain;
    if (!FALL.layer) FALL.layer = viewer.imageryLayers.addImageryProvider(await Cesium.IonImageryProvider.fromAssetId(2));
  } catch (e) {
    console.warn('Sense terreny de Cesium (cal el token d\'ion):', e);
    msg('Sense el token de Cesium no es pot veure el terreny des de sota', 5000);
  }
  if (!FALL.on) return;                                   // s'ha cancel·lat mentre carregava
  const g = viewer.scene.globe;
  g.baseColor = Cesium.Color.fromCssColorString('#3a3226');
  g.translucency.enabled = true;
  g.translucency.frontFaceAlpha = 0;                      // encara invisible: Google mana
  g.translucency.backFaceAlpha = 0;
  g.show = true;                                          // comença a carregar
  FALL.ready = true;
}

function switchToAbyss() {
  FALL.switched = true;
  const g = viewer.scene.globe;
  g.translucency.frontFaceAlpha = 1;
  g.translucency.backFaceAlpha = 1;
  g.undergroundColor = Cesium.Color.fromCssColorString('#120d08');
  viewer.scene.backgroundColor = Cesium.Color.BLACK;
  document.getElementById('gmap').style.opacity = 0;
  S.tilt = Math.max(S.tilt, 100);                          // mira una mica amunt: es veu el terra des de sota
}

function resetFall() {
  FALL.on = false; FALL.ready = false; FALL.switched = false; FALL.off = 0;
  if (FALL.hole) { viewer.entities.remove(FALL.hole); FALL.hole = null; }
  const g = viewer.scene.globe;
  g.show = false; g.translucency.enabled = false; g.baseColor = Cesium.Color.TRANSPARENT;
  viewer.scene.backgroundColor = Cesium.Color.TRANSPARENT;
  document.getElementById('gmap').style.opacity = 1;
  S.agl = 25; S.vz = 0; S.tilt = 70;                       // torna a caure del cel, al mateix lloc
}

function findBones() {
  const all = Object.keys(knight._nodesByName || {});
  for (const b in BONES) {
    const name = all.find(n => n.includes(b) && !(b === 'LeftArm' && n.includes('ForeArm')) && !(b === 'RightArm' && n.includes('ForeArm')));
    const node = name && knight.getNode(name);
    if (!node) { console.warn('Os no trobat:', b); continue; }
    const norm = v => Cesium.Cartesian3.normalize(new Cesium.Cartesian3(...v), new Cesium.Cartesian3());
    bones[b] = { node, lat: norm(BONES[b].lat), fwd: BONES[b].fwd ? norm(BONES[b].fwd) : null };
  }
  if (!Object.keys(bones).length) msg('No he trobat l\'esquelet: el cavaller lliscarà sense moure les cames', 6000);
}

// ------------------------------------------------------------------
// BUCLE PRINCIPAL
// ------------------------------------------------------------------
function tick() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const K = S.keys;

  // --- moviment ---
  let f = (K.KeyW?1:0) - (K.KeyS?1:0);
  let r = (K.KeyD?1:0) - (K.KeyA?1:0);
  const moving = (f || r) && !FALL.on;
  const run = K.ShiftLeft || K.ShiftRight;
  const speed = run ? CFG.runSpeed : CFG.walkSpeed;
  let dist = 0;
  if (moving) {
    const bearing = R(S.heading) + Math.atan2(r, f);
    dist = speed * dt;
    const north = Math.cos(bearing) * dist, east = Math.sin(bearing) * dist;
    S.lat += Cesium.Math.toDegrees(north / 6378137);
    S.lon += Cesium.Math.toDegrees(east / (6378137 * Math.cos(R(S.lat))));
    // estil Assassin's Creed: el cavaller es gira cap a on camina
    S.facing = turnTowards(S.facing, bearing, CFG.turnSpeed * dt);
  }
  if (K.KeyQ) S.heading -= 90 * dt;
  if (K.KeyE) S.heading += 90 * dt;

  // --- terra i gravetat ---
  let onGround;
  if (FALL.on) {
    // caiguda a l'abisme: el forat s'obre i després no hi ha terra
    FALL.t += dt;
    if (FALL.ready && FALL.t > 0.7) {
      S.vz = Math.max(-60, S.vz - CFG.gravity * dt);
      S.agl += S.vz * dt;
    }
    onGround = false;
  } else {
    const h = sampleGround(S.lat, S.lon);
    if (h !== null) S.ground += (h - S.ground) * Math.min(1, 15 * dt);
    S.vz -= CFG.gravity * dt;
    S.agl += S.vz * dt;
    onGround = S.agl <= 0;
    if (onGround) { S.agl = 0; S.vz = 0; }
    if (K.Space && onGround) S.vz = CFG.jumpSpeed;
  }

  // --- animació procedural ---
  const target = moving && onGround ? 1 : 0;
  S.walkAmt += (target - S.walkAmt) * Math.min(1, 8 * dt);
  S.phase += dist / (run ? CFG.runStride : CFG.walkStride) * Math.PI * 2;
  animateBones(run, onGround);

  // --- posició del cavaller ---
  const bob = 0.05 * S.walkAmt * Math.cos(2 * S.phase);
  const pos = Cesium.Cartesian3.fromDegrees(S.lon, S.lat, S.ground + FALL.off + S.agl + bob);
  const hpr = new Cesium.HeadingPitchRoll(S.facing - Math.PI / 2 + R(CAL.yawOffset), 0, 0);
  if (knight) knight.modelMatrix = Cesium.Transforms.headingPitchRollToFixedFrame(pos, hpr);
  if (marker) marker.position = pos;

  // --- càmeres sincronitzades ---
  syncCameras();
  updateHud(onGround);
}

function animateBones(run, onGround) {
  if (!knight || !knight.ready) return;
  const a = S.walkAmt, p = S.phase;
  const air = onGround ? 0 : 1;
  if (a < 0.01 && !air) {           // quiet: torna el control a l'animació Idle
    for (const b in bones) if (bones[b].active) { bones[b].node.matrix = undefined; bones[b].active = false; }
    return;
  }
  const A = R(run ? 45 : 28) * a, Kn = R(run ? 65 : 38) * a, ADD = R(10) * a;
  const s = Math.sin(p), c = Math.cos(p);
  const pose = {
    LeftUpLeg:  { sw: -A * s - R(25) * air, ad: -ADD },
    RightUpLeg: { sw:  A * s - R(25) * air, ad:  ADD },
    LeftLeg:    { sw: Kn * Math.max(0,  c) + R(50) * air },
    RightLeg:   { sw: Kn * Math.max(0, -c) + R(50) * air },
    LeftArm:    { sw:  A * 0.7 * s },
    RightArm:   { sw: -A * 0.2 * s },   // porta l'espasa: es mou poc
  };
  for (const b in bones) {
    const B = bones[b], P = pose[b];
    let q = Cesium.Quaternion.fromAxisAngle(B.lat, P.sw);
    if (B.fwd && P.ad) q = Cesium.Quaternion.multiply(q, Cesium.Quaternion.fromAxisAngle(B.fwd, P.ad), new Cesium.Quaternion());
    const rot = Cesium.Matrix4.fromRotation(Cesium.Matrix3.fromQuaternion(q));
    B.node.matrix = Cesium.Matrix4.multiply(B.node.originalMatrix, rot, new Cesium.Matrix4());
    B.active = true;
  }
}

function syncCameras() {
  S.tilt = Cesium.Math.clamp(S.tilt, 5, 125);
  S.range = Cesium.Math.clamp(S.range, 2.5, 80);

  // Mirar amunt (inclinació > 90°): com als videojocs, el punt on mira la càmera
  // puja per sobre del cap i la càmera s'acosta perquè no quedi sota terra.
  const upDeg = Math.max(0, S.tilt - 90);
  const lookH = CFG.lookHeight + upDeg * 0.04;
  let range = S.range;
  const cosT = Math.cos(R(S.tilt));
  if (cosT < 0 && !FALL.switched) range = Math.max(1.5, Math.min(range, (lookH - 0.6) / -cosT));

  // Caiguda: quan la càmera hauria de passar per sota del terra, Google ja no
  // la pot seguir. Llavors amaguem Google i Cesium dibuixa el terreny (vist des de sota).
  if (FALL.on && FALL.ready && !FALL.switched && S.agl + lookH + range * cosT < 0.5) switchToAbyss();

  // Google: l'alçada del centre és sobre el NIVELL DEL MAR
  if (map3d && !FALL.switched) {
    const alt = S.ground + S.agl + lookH + CAL.vOffset;   // Google: sobre el nivell del mar, com l'Elevation API
    map3d.center = { lat: S.lat, lng: S.lon, altitude: alt };
    map3d.heading = ((S.heading % 360) + 360) % 360;
    map3d.tilt = S.tilt;
    map3d.range = range;
    map3d.fov = CAL.vfov;                       // mateix camp de visió vertical que Cesium
  }

  // Cesium: mateixa càmera, sobre el terra de Cesium
  const cam = viewer.camera;
  const aspect = viewer.canvas.clientWidth / Math.max(1, viewer.canvas.clientHeight);
  const v = R(CAL.vfov);
  cam.frustum.fov = aspect > 1 ? 2 * Math.atan(Math.tan(v / 2) * aspect) : v;
  // Google no deixa baixar la càmera a tocar de terra i la puja pel seu compte.
  // Per això copiem la càmera REAL de Google (cameraPosition) en lloc de calcular-la.
  // Google sempre mira al centre (el cavaller), així que orientem la càmera de
  // Cesium des d'aquella posició cap al cavaller: queda centrat encara que Google
  // hagi mogut la càmera.
  const cp = map3d && map3d.cameraPosition;
  if (cp && isFinite(cp.altitude) && !FALL.switched) {
    const P = Cesium.Cartesian3.fromDegrees(cp.lng, cp.lat, cp.altitude - CAL.vOffset + FALL.off);
    const T = Cesium.Cartesian3.fromDegrees(S.lon, S.lat, S.ground + FALL.off + S.agl + lookH);
    const dir = Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(T, P, new Cesium.Cartesian3()), new Cesium.Cartesian3());
    const nrm = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(P, new Cesium.Cartesian3());
    const up = Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(nrm,
      Cesium.Cartesian3.multiplyByScalar(dir, Cesium.Cartesian3.dot(nrm, dir), new Cesium.Cartesian3()), new Cesium.Cartesian3()), new Cesium.Cartesian3());
    cam.setView({ destination: P, orientation: { direction: dir, up } });
  } else {
    const t = Cesium.Cartesian3.fromDegrees(S.lon, S.lat, S.ground + FALL.off + S.agl + lookH);
    cam.lookAt(t, new Cesium.HeadingPitchRange(R(S.heading), -R(90 - S.tilt), range));
    cam.lookAtTransform(Cesium.Matrix4.IDENTITY);
  }
  viewer.scene.light.direction = Cesium.Cartesian3.clone(cam.directionWC, viewer.scene.light.direction);
}

// ------------------------------------------------------------------
// CONTROLS
// ------------------------------------------------------------------
function initInput() {
  document.getElementById('hud').style.display = 'block';
  addEventListener('keydown', e => {
    S.keys[e.code] = true;
    if (['Space','PageUp','PageDown'].includes(e.code)) e.preventDefault();
    if (e.code === 'BracketLeft')  { CAL.vfov = Math.max(10, CAL.vfov - 1); saveCal(); }
    if (e.code === 'BracketRight') { CAL.vfov = Math.min(100, CAL.vfov + 1); saveCal(); }
    const step = e.shiftKey ? 5 : 0.5;
    if (e.code === 'PageUp')   { CAL.vOffset += step; saveCal(); }
    if (e.code === 'PageDown') { CAL.vOffset -= step; saveCal(); }
    if (e.code === 'KeyP' && marker) marker.show = !marker.show;
    if (knight && (e.code === 'Equal' || e.code === 'NumpadAdd'))      knight.scale *= 10;
    if (knight && (e.code === 'Minus' || e.code === 'NumpadSubtract')) knight.scale /= 10;
    if (e.code === 'KeyR') { CAL.yawOffset = (CAL.yawOffset + 90) % 360; saveCal(); }
    if (e.code === 'KeyG') {
      S.showGround = !S.showGround;
      viewer.scene.globe.baseColor = S.showGround ? new Cesium.Color(1, 0.2, 0.2, 0.35) : Cesium.Color.TRANSPARENT;
    }
    if (e.key === 'ñ' || e.key === 'Ñ' || e.code === 'Semicolon') { FALL.on ? resetFall() : startFall(); }
    if (e.code === 'KeyM') {
      if (document.pointerLockElement) document.exitPointerLock();
      else viewer.canvas.requestPointerLock();
    }
  });
  addEventListener('keyup', e => S.keys[e.code] = false);
  addEventListener('blur', () => S.keys = {});

  const cv = viewer.canvas; let drag = false;
  cv.addEventListener('pointerdown', () => { drag = true; if (!document.pointerLockElement) cv.requestPointerLock(); });
  addEventListener('pointerup', () => drag = false);
  addEventListener('mousemove', e => {
    if (!drag && document.pointerLockElement !== cv) return;
    S.heading += e.movementX * CFG.mouseSens;
    S.tilt    -= e.movementY * CFG.mouseSens;
  });
  cv.addEventListener('wheel', e => { e.preventDefault(); S.range *= e.deltaY > 0 ? 1.1 : 0.9; }, { passive:false });
}

function updateHud(onGround) {
  document.getElementById('hud').textContent =
`WASD caminar · Shift córrer · Espai saltar
Clic: el ratolí mou la càmera · Esc: deixar-lo anar · Roda zoom
Q / E girar càmera

CALIBRATGE
[ ]   FOV: ${CAL.vfov}°
PgUp/PgDn alçada: ${CAL.vOffset.toFixed(1)} m (Shift: ×10)
R     girar model: ${CAL.yawOffset}°
G     veure terra Cesium: ${S.showGround ? 'sí' : 'no'}
Ñ     caure a l'abisme / tornar a dalt
P     punt groc als peus
terra: ${S.ground.toFixed(1)} m (${GRID.src})

CAVALLER: ${modelStatus}
escala: ${knight ? knight.scale : '-'}  (+ / -)

${S.lat.toFixed(6)}, ${S.lon.toFixed(6)}  ${onGround ? '' : '(a l\'aire)'}`;
}

// ------------------------------------------------------------------
// UTILITATS
// ------------------------------------------------------------------
function turnTowards(a, b, k) {
  let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  return a + d * Math.min(1, k);
}
function val(id) { return document.getElementById(id).value.trim(); }
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : (k === 'cav_cal3' ? JSON.parse(v) : v); } catch(e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
function saveCal() { save('cav_cal3', JSON.stringify(CAL)); }
let msgT;
function msg(t, ms) {
  const m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block';
  clearTimeout(msgT); if (ms) msgT = setTimeout(() => m.style.display = 'none', ms);
}
</script>
